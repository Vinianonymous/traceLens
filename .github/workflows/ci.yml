name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: make install
      - name: Lint, format, typecheck, test, build
        run: make check
      - name: Install Chromium for browser smoke tests
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Exercise browser workflows
        run: cd apps/web && npm run test:e2e
      - name: Preserve failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Smoke test local stack
        run: |
          trap 'docker compose down' EXIT
          docker compose up --build -d --wait
          curl --fail http://127.0.0.1:8000/api/v1/health
          curl --fail http://127.0.0.1:8001/items
          curl --fail http://127.0.0.1:5173/
          curl --fail -X POST http://127.0.0.1:8000/api/v1/requests/send -H 'Content-Type: application/json' -d '{"method":"GET","url":"http://demo-api:8001/items"}' | grep 'Notebook'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/requests/send -H 'Content-Type: application/json' -d '{"method":"GET","url":"http://example.com/items"}')" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/requests/send -H 'Content-Type: application/json' -d '{"method":"GET","url":"http://demo-api:8001/redirect"}')" = 502
